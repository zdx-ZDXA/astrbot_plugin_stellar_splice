<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f8f6fc" />
<title>星缀 StellarSplice</title>
<style>
  :root {
    color-scheme: light;
    --bg1: #f4f4f6;
    --card: #f4f4f6;
    --line: #e7e2f0;
    --text: #2c2738;
    --muted: #857d94;
    --pink: #e8489a;
    --pink2: #f43f5e;
    --accent: #7b68ee;
    --ok: #0284c7;
    --hover: #ece6f2;
    --track: rgba(44, 39, 56, 0.08);
    --canvas-grid: rgba(44, 39, 56, 0.12);
    --canvas-axis: rgba(44, 39, 56, 0.10);
    --canvas-label: rgba(44, 39, 56, 0.68);
    --canvas-fill: rgba(232, 72, 154, 0.16);
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg1: #1e1e22;
    --card: #1e1e22;
    --line: #3a3a40;
    --text: #f3eff8;
    --muted: #a89fb8;
    --pink: #f472b6;
    --pink2: #fb7185;
    --accent: #a78bfa;
    --ok: #38bdf8;
    --hover: #2a2434;
    --track: rgba(255, 255, 255, 0.10);
    --canvas-grid: rgba(255, 255, 255, 0.12);
    --canvas-axis: rgba(255, 255, 255, 0.08);
    --canvas-label: rgba(243, 239, 248, 0.72);
    --canvas-fill: rgba(244, 114, 182, 0.20);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; width: 100%; max-width: 100%; overflow-x: hidden; }
  body {
    width: 100%; max-width: 100%;
    overscroll-behavior-x: none;
    background: var(--card);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  .wrap { width: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  /* 顶栏 */
  header { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px; }
  .brand { display: flex; align-items: center; gap: 9px; font-size: 20px; font-weight: 650;
    letter-spacing: .5px; cursor: pointer; user-select: none; touch-action: manipulation; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--pink);
    box-shadow: 0 0 10px rgba(232, 72, 154, .45); }
  .clock { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums;
    cursor: pointer; user-select: none; touch-action: manipulation; }

  /* 页签 */
  .tabs { display: flex; gap: 4px; padding: 3px; background: var(--track); border-radius: 12px; }
  .tab { flex: 1; padding: 8px 10px; border: 0; background: transparent; color: var(--muted);
    font-size: 13px; font-weight: 500; border-radius: 9px; cursor: pointer;
    transition: background .15s, color .15s; font-family: inherit; }
  .tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.06); }

  /* 卡片 */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 16px; }
  .label { color: var(--muted); font-size: 12px; letter-spacing: .4px; }
  .value { font-size: 17px; font-weight: 600; margin-top: 5px; line-height: 1.35; }
  .sub { color: var(--muted); font-size: 11.5px; line-height: 1.5; margin-top: 4px; }

  /* Hero */
  .hero-top { display: flex; justify-content: space-between; align-items: flex-end; }
  .dominant { font-size: 25px; font-weight: 650; margin-top: 4px; }
  .hero-score { color: var(--pink); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hero-score small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 2px; }
  .hero-lock { font-size: 13px; color: var(--muted); }
  canvas { display: block; margin: 2px auto 0; max-width: 100%; height: auto; }

  /* 进度条 */
  .bars { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin-top: 10px; }
  .bar-row { display: grid; grid-template-columns: 34px 1fr 30px; align-items: center; gap: 7px; font-size: 12px; }
  .bar-row span:first-child { color: var(--muted); }
  .bar-row .num { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
  .track { height: 6px; background: var(--track); border-radius: 99px; overflow: hidden; }
  .fill { display: block; height: 100%; width: 0; border-radius: 99px;
    background: linear-gradient(90deg, var(--pink), var(--pink2)); transition: width .5s ease; }

  /* 网格 */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid2 .cell { background: var(--track); border-radius: 12px; padding: 10px 12px; }
  .grid2 .cell .label { font-size: 11px; }
  .grid2 .cell .value { font-size: 15px; margin-top: 3px; }

  /* 日程 */
  .schedule { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 7px; }
  .schedule li { display: flex; gap: 10px; font-size: 12.5px; padding: 8px 10px;
    border-radius: 10px; background: transparent; border: 1px solid var(--line); }
  .schedule li.current { background: rgba(244,114,182,.14); border: 1px solid rgba(244,114,182,.32); }
  .schedule li.past { opacity: .55; }
  .schedule .t { color: var(--muted); min-width: 80px; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .schedule .txt { flex: 1; min-width: 0; line-height: 1.45; }
  .schedule .txt b { font-weight: 600; }
  .schedule .txt .steps { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .schedule .meta { font-size: 10px; color: var(--muted); margin-top: 3px; }

  /* 挂载 */
  .plugins { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .plugin-item { display: flex; align-items: center; gap: 8px; padding: 9px 11px;
    border-radius: 11px; border: 1px solid var(--line); font-size: 13px; }
  .pdot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .pdot.on { background: var(--ok); box-shadow: 0 0 6px rgba(2,132,199,.4); }
  .pdot.off { background: var(--line); }
  .pname { flex: 1; }
  .pstatus { font-size: 11px; color: var(--muted); }

  /* 表单 */
  .form-row { display: grid; gap: 10px; margin-bottom: 10px; }
  @media (min-width: 480px) { .form-row { grid-template-columns: 1fr 1fr; } }
  .f-label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  input, select { padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--track); color: var(--text); font-size: 14px; width: 100%;
    font-family: inherit; }
  input:focus, select:focus { outline: none; border-color: var(--pink); background: var(--card); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .scene-chip { padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line);
    font-size: 12px; cursor: pointer; background: var(--track); transition: all .15s; }
  .scene-chip.sel { background: var(--pink); color: #fff; border-color: var(--pink); }
  .btn { padding: 10px 22px; background: linear-gradient(135deg, var(--pink), var(--pink2));
    color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 500;
    cursor: pointer; font-family: inherit; box-shadow: 0 2px 8px rgba(244,114,182,.25); }
  .btn:active { transform: translateY(1px); }
  .btn-sm { padding: 6px 14px; font-size: 13px; }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--muted);
    border-radius: 8px; padding: 5px 12px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .btn-ghost:hover { border-color: var(--pink); color: var(--pink); }
  .btn-del { background: transparent; color: var(--pink2); border: 1px solid var(--line);
    border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .btn-del:hover { border-color: var(--pink2); }

  /* 表格 */
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 8px;
    border-bottom: 1px solid var(--line); font-size: 12px; }
  td { padding: 9px 8px; border-bottom: 1px solid var(--line); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10px;
    background: var(--track); color: var(--muted); margin: 1px; }
  .badge.chat { background: rgba(232,72,154,.15); color: var(--pink); }

  /* 提示 */
  .msg { padding: 9px 12px; border-radius: 10px; margin-bottom: 12px; font-size: 13px; display: none; }
  .msg.ok { background: rgba(2,132,199,.12); color: var(--ok); display: block; }
  .msg.err { background: rgba(244,63,94,.12); color: var(--pink2); display: block; }
  .empty { color: var(--muted); text-align: center; padding: 24px; font-size: 13px; }
  .sec-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
  .sec-title .label { margin: 0; }
  .count { font-size: 12px; color: var(--muted); font-weight: 400; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand" onclick="location.reload()">
      <span class="dot"></span><span>星缀</span>
    </div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <div class="tabs">
    <button class="tab active" data-view="status">状态</button>
    <button class="tab" data-view="schedule">日程</button>
    <button class="tab" data-view="wardrobe">衣柜</button>
    <button class="tab" data-view="plugins">挂载</button>
  </div>

  <!-- ══ 状态 ══ -->
  <div id="view-status">
    <div class="card">
      <div class="hero-top">
        <div>
          <div class="label">当前人格</div>
          <div class="dominant" id="persona-name">—</div>
          <div class="hero-lock" id="persona-lock"></div>
        </div>
        <div class="hero-score"><span id="top-feel">—</span><small id="top-feel-num"></small></div>
      </div>
      <canvas id="radar" width="230" height="230"></canvas>
      <div class="bars" id="feel-bars"></div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="label">此刻</div>
      <div class="grid2" style="margin-top:8px">
        <div class="cell">
          <div class="label">在做什么</div>
          <div class="value" id="now-activity">—</div>
        </div>
        <div class="cell">
          <div class="label">在哪</div>
          <div class="value" id="now-place">—</div>
        </div>
        <div class="cell">
          <div class="label">穿着</div>
          <div class="value" id="now-outfit" style="font-size:13px">—</div>
        </div>
        <div class="cell">
          <div class="label">下一段</div>
          <div class="value" id="next-activity" style="font-size:13px">—</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ 日程 ══ -->
  <div id="view-schedule" style="display:none">
    <div class="card">
      <div class="sec-title">
        <div class="label">今日日程</div>
        <button class="btn-ghost" onclick="loadSchedule()">刷新</button>
      </div>
      <ul class="schedule" id="schedule-list">
        <li class="empty">暂无日程</li>
      </ul>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="label">手动添加</div>
      <div class="form-row" style="margin-top:8px">
        <label class="f-label">时间段
          <input type="text" id="p-time" placeholder="19:00-21:00"/>
        </label>
        <label class="f-label">地点
          <input type="text" id="p-place" placeholder="电影院"/>
        </label>
      </div>
      <label class="f-label" style="margin-bottom:10px">大事项（锁定后 AI 只能补步骤）
        <input type="text" id="p-intent" placeholder="看电影" maxlength="24"/>
      </label>
      <button class="btn btn-sm" onclick="addPlan()">+ 添加日程</button>
    </div>
  </div>

  <!-- ══ 衣柜 ══ -->
  <div id="view-wardrobe" style="display:none">
    <div class="msg" id="w-msg"></div>

    <div class="card">
      <div class="label">添加服装</div>
      <div class="form-row" style="margin-top:8px">
        <label class="f-label">名称
          <input type="text" id="f-name" placeholder="浅粉色真丝吊带睡裙" maxlength="40"/>
        </label>
        <label class="f-label">槽位
          <select id="f-slot">
            <option value="dress">整套（推荐）</option>
            <option value="top">上衣</option>
            <option value="bottom">裤子/裙子</option>
            <option value="jk_shirt">JK衬衣</option>
            <option value="jk_skirt">JK格裙</option>
            <option value="shoes">鞋</option>
            <option value="socks">袜子</option>
            <option value="accessory">配饰</option>
          </select>
        </label>
      </div>
      <div style="margin-bottom:10px">
        <div class="label" style="margin-bottom:6px">适用场景</div>
        <div class="chip-row" id="scene-chips">
          <span class="scene-chip" data-s="work">上班</span>
          <span class="scene-chip" data-s="home">在家</span>
          <span class="scene-chip" data-s="casual">日常</span>
          <span class="scene-chip" data-s="out">出门</span>
          <span class="scene-chip" data-s="formal">正式</span>
          <span class="scene-chip" data-s="sport">运动</span>
          <span class="scene-chip" data-s="sleep">睡觉</span>
          <span class="scene-chip" data-s="beach">海边</span>
        </div>
      </div>
      <label class="f-label" style="margin-bottom:10px">备注（选填）
        <input type="text" id="f-note"/>
      </label>
      <button class="btn btn-sm" onclick="addCloth()">+ 加入衣柜</button>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="sec-title">
        <div class="label">我的衣柜 <span class="count" id="w-count"></span></div>
        <button class="btn-ghost" onclick="loadWardrobe()">刷新</button>
      </div>
      <table>
        <thead><tr><th>名称</th><th>场景</th><th>槽位</th><th></th></tr></thead>
        <tbody id="w-list"><tr><td colspan="4" class="empty">读取中…</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- ══ 挂载 ══ -->
  <div id="view-plugins" style="display:none">
    <div class="card">
      <div class="label">执行器挂载状态</div>
      <div class="plugins" id="plugin-grid">
        <div class="plugin-item"><span class="pdot off"></span><span class="pname">读取中</span></div>
      </div>
      <div class="sub" style="margin-top:12px">
        星缀是大脑，这四个是可插拔的执行器。没装不影响主流程，只是对应能力不可用。
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="label">版本信息</div>
      <div class="grid2" style="margin-top:8px">
        <div class="cell">
          <div class="label">星缀版本</div>
          <div class="value" id="pl-version">—</div>
        </div>
        <div class="cell">
          <div class="label">人格状态</div>
          <div class="value" id="pl-persona" style="font-size:13px">—</div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
const bridge = window.AstrBotPluginView || window.AstrBotPluginPage;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const FEEL = {joy:'喜', anger:'怒', sorrow:'哀', fear:'惧', love:'爱', energy:'精力', hunger:'饿'};
const SLOT = {dress:'整套', top:'上衣', bottom:'裤/裙', jk_shirt:'JK衬', jk_skirt:'JK裙', shoes:'鞋', socks:'袜', accessory:'配饰'};
const SCENE = {work:'上班', home:'在家', casual:'日常', out:'出门', formal:'正式', sport:'运动', sleep:'睡觉', beach:'海边'};

let lastState = {};

/* ── 时钟 ── */
function tick() {
  const n = new Date();
  document.getElementById('clock').textContent =
    String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
}
tick(); setInterval(tick, 15000);

/* ── 页签 ── */
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    const v = btn.dataset.view;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
    ['status','schedule','wardrobe','plugins'].forEach(k => {
      document.getElementById('view-' + k).style.display = (k === v) ? 'block' : 'none';
    });
    if (v === 'wardrobe') loadWardrobe();
    if (v === 'schedule') loadSchedule();
  });
});

/* ── 雷达图 ── */
function drawRadar(vals) {
  const canvas = document.getElementById('radar');
  if (!canvas) return;
  const keys = Object.keys(FEEL);
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const size = 230;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, size, size);

  const cx = size / 2, cy = size / 2, radius = size / 2 - 30;
  const step = (Math.PI * 2) / keys.length;

  // 网格
  ctx.strokeStyle = getCSS('--canvas-grid');
  ctx.lineWidth = 1;
  for (let ring = 1; ring <= 4; ring++) {
    ctx.beginPath();
    keys.forEach((_, i) => {
      const a = -Math.PI / 2 + step * i;
      const r = radius * ring / 4;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.stroke();
  }

  // 轴 + 标签
  const points = [];
  keys.forEach((key, i) => {
    const a = -Math.PI / 2 + step * i;
    ctx.strokeStyle = getCSS('--canvas-axis');
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius);
    ctx.stroke();

    const v = Math.max(0, Math.min(100, Number(vals[key] || 0)));
    const r = radius * v / 100;
    points.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);

    ctx.fillStyle = getCSS('--canvas-label');
    ctx.font = '12px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(FEEL[key], cx + Math.cos(a) * (radius + 16), cy + Math.sin(a) * (radius + 16));
  });

  // 数据面
  if (points.length) {
    ctx.beginPath();
    points.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
    ctx.closePath();
    ctx.fillStyle = getCSS('--canvas-fill');
    ctx.fill();
    ctx.strokeStyle = getCSS('--pink');
    ctx.lineWidth = 2;
    ctx.stroke();
    points.forEach(([x, y]) => {
      ctx.beginPath();
      ctx.arc(x, y, 3, 0, Math.PI * 2);
      ctx.fillStyle = getCSS('--pink');
      ctx.fill();
    });
  }
}

function getCSS(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

/* ── 主状态 ── */
async function loadStatus() {
  if (!bridge) return fallback();
  try {
    const d = await bridge.apiGet('state');
    lastState = d || {};
    render(d || {});
  } catch (e) {
    document.getElementById('persona-name').textContent = '读取失败';
  }
}

function render(d) {
  // 人格
  document.getElementById('persona-name').textContent = d.persona_name || '—';
  document.getElementById('persona-lock').textContent =
    d.persona_locked ? '🔒 已锁定' : '🔓 待读取';

  // 情绪
  const feels = d.feelings || {};
  drawRadar(feels);

  let topKey = '—', topVal = -1;
  Object.keys(FEEL).forEach(k => {
    const v = Number(feels[k] || 0);
    if (v > topVal) { topVal = v; topKey = k; }
  });
  document.getElementById('top-feel').textContent = topVal >= 0 ? FEEL[topKey] : '—';
  document.getElementById('top-feel-num').textContent = topVal >= 0 ? String(Math.round(topVal)) : '';

  // 条形
  document.getElementById('feel-bars').innerHTML = Object.keys(FEEL).map(k => {
    const v = Math.max(0, Math.min(100, Number(feels[k] || 0)));
    return `<div class="bar-row">
      <span>${FEEL[k]}</span>
      <div class="track"><span class="fill" style="width:${v}%"></span></div>
      <span class="num">${Math.round(v)}</span>
    </div>`;
  }).join('');

  // 此刻
  const sched = d.schedule_today || [];
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();

  let cur = null, next = null;
  sched.forEach(s => {
    const sm = toMin(s.start), em = toMin(s.end);
    if (sm <= nowMin && nowMin < em) cur = s;
    if (sm > nowMin && (!next || sm < toMin(next.start))) next = s;
  });

  document.getElementById('now-activity').textContent = cur ? (cur.intent || cur.activity || '休息') : '休息';
  document.getElementById('now-place').textContent = cur ? (cur.place || '家') : '家';
  document.getElementById('now-outfit').textContent = d.outfit || cur?.outfit || '—';
  document.getElementById('next-activity').textContent = next
    ? `${next.start} ${next.intent || next.activity || ''}` : '今天没更多安排';

  // 挂载
  const pl = d.plugins || {};
  const LABELS = {canvas:'星绘', voice:'星言', guard:'星盾', memory:'星忆'};
  const html = Object.entries(LABELS).map(([k, name]) => {
    const on = !!pl[k];
    return `<div class="plugin-item">
      <span class="pdot ${on ? 'on' : 'off'}"></span>
      <span class="pname">${esc(name)}</span>
      <span class="pstatus">${on ? '已挂载' : '未安装'}</span>
    </div>`;
  }).join('');
  document.getElementById('plugin-grid').innerHTML = html;

  // 版本页
  document.getElementById('pl-version').textContent = d.version || '—';
  document.getElementById('pl-persona').textContent =
    (d.persona_name || '—') + (d.persona_locked ? ' · 已锁定' : ' · 待读取');
}

function toMin(t) {
  const [h, m] = String(t || '0:0').split(':').map(Number);
  return (h || 0) * 60 + (m || 0);
}

function fallback() {
  document.getElementById('persona-name').textContent = '未连接';
  document.getElementById('feel-bars').innerHTML =
    '<div class="empty">请在 AstrBot 插件详情页打开本面板</div>';
}

/* ── 日程 ── */
async function loadSchedule() {
  if (!bridge) return;
  try {
    const d = await bridge.apiGet('state');
    renderSchedule(d?.schedule_today || []);
  } catch (e) {}
}

function renderSchedule(sched) {
  const ul = document.getElementById('schedule-list');
  if (!sched.length) {
    ul.innerHTML = '<li class="empty">今天还没有日程</li>';
    return;
  }
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  ul.innerHTML = sched.map(s => {
    const sm = toMin(s.start), em = toMin(s.end);
    const isCur = sm <= nowMin && nowMin < em;
    const isPast = em <= nowMin;
    const lock = s.locked ? ' 🔒' : '';
    const src = s._src === 'chat' ? '<span class="badge chat">聊</span>' : '';
    const steps = s.steps ? `<div class="steps">${esc(s.steps.slice(0, 72))}</div>` : '';
    return `<li class="${isCur ? 'current' : isPast ? 'past' : ''}">
      <span class="t">${esc(s.start)}–${esc(s.end)}</span>
      <div class="txt">
        <b>${esc(s.intent || s.activity || '休息')}</b>${lock}${src}
        ${steps}
        <div class="meta">${esc(s.place || '')}</div>
      </div>
    </li>`;
  }).join('');
}

async function addPlan() {
  const time = document.getElementById('p-time').value.trim();
  const intent = document.getElementById('p-intent').value.trim();
  const place = document.getElementById('p-place').value.trim();
  if (!intent) { alert('请填写大事项'); return; }
  if (!bridge) { alert('面板未连接'); return; }
  try {
    const res = await bridge.apiPost('plan/add', { time, intent, place });
    if (res?.code === 0) {
      document.getElementById('p-time').value = '';
      document.getElementById('p-intent').value = '';
      document.getElementById('p-place').value = '';
      await loadSchedule();
      alert('✅ 已添加');
    } else {
      alert(res?.msg || '添加失败');
    }
  } catch (e) { alert('请求失败: ' + e?.message); }
}

/* ── 衣柜 ── */
async function loadWardrobe() {
  if (!bridge) {
    document.getElementById('w-list').innerHTML =
      '<tr><td colspan="4" class="empty">请在插件详情页打开</td></tr>';
    return;
  }
  try {
    const d = await bridge.apiGet('wardrobe');
    renderWardrobe(d);
  } catch (e) {
    document.getElementById('w-list').innerHTML =
      `<tr><td colspan="4" class="empty">读取失败</td></tr>`;
  }
}

function renderWardrobe(d) {
  const items = d?.data?.items || [];
  document.getElementById('w-count').textContent = `（${items.length}）`;
  const tb = document.getElementById('w-list');
  if (!items.length) {
    tb.innerHTML = '<tr><td colspan="4" class="empty">还没有服装</td></tr>';
    return;
  }
  tb.innerHTML = items.map(it => {
    const scenes = (it.scenes || []).map(s => `<span class="badge">${esc(SCENE[s] || s)}</span>`).join(' ');
    return `<tr>
      <td>${esc(it.name)}</td>
      <td>${scenes}</td>
      <td style="color:var(--muted);font-size:12px">${esc(SLOT[it.slot] || it.slot || '')}</td>
      <td><button class="btn-del" onclick="delCloth('${esc(it.id)}')">删除</button></td>
    </tr>`;
  }).join('');
}

document.querySelectorAll('.scene-chip').forEach(c => {
  c.addEventListener('click', () => c.classList.toggle('sel'));
});

function toast(text, ok) {
  const el = document.getElementById('w-msg');
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
  setTimeout(() => { el.className = 'msg'; }, 2600);
}

async function addCloth() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { toast('请填写名称', false); return; }
  if (!bridge) { toast('面板未连接', false); return; }
  const scenes = [...document.querySelectorAll('.scene-chip.sel')].map(c => c.dataset.s);
  const slot = document.getElementById('f-slot').value;
  const note = document.getElementById('f-note').value.trim();
  try {
    const res = await bridge.apiPost('wardrobe/add', { name, scenes, slot, note });
    if (res?.code === 0) {
      toast('✅ 已加入', true);
      document.getElementById('f-name').value = '';
      document.getElementById('f-note').value = '';
      document.querySelectorAll('.scene-chip').forEach(c => c.classList.remove('sel'));
      await loadWardrobe();
    } else {
      toast(res?.msg || '添加失败', false);
    }
  } catch (e) { toast('请求失败', false); }
}

async function delCloth(id) {
  if (!confirm('确认删除？')) return;
  try {
    const res = await bridge.apiPost('wardrobe/delete', { id });
    if (res?.code === 0) { toast('已删除', true); await loadWardrobe(); }
    else toast(res?.msg || '删除失败', false);
  } catch (e) { toast('请求失败', false); }
}

/* ── 初始化 ── */
if (bridge) {
  bridge.ready?.().then(() => loadStatus());
  setInterval(() => {
    const cur = document.querySelector('.tab.active')?.dataset.view;
    if (cur === 'status') loadStatus();
  }, 20000);
} else {
  fallback();
}
</script>
</body>
</html>
